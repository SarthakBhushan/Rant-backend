spring.application.name=rant

# Database Configuration (Reads from environment variables in production, fallback to local)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/rant}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Enable scheduling for the expiry job
spring.task.scheduling.pool.size=1

# Caffeine Cache config for the feed (5 seconds expiration)
spring.cache.type=caffeine
spring.cache.caffeine.spec=expireAfterWrite=5s,maximumSize=100
